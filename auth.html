<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول - GiveAdd</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Cairo;
}

body{
    background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

/* خلفية متحركة */
body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:#2563eb55;
    border-radius:50%;
    filter:blur(120px);
    top:-100px;
    right:-100px;
}

body::after{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:#06b6d455;
    border-radius:50%;
    filter:blur(120px);
    bottom:-100px;
    left:-100px;
}

.box{
    position:relative;
    z-index:2;
    background:rgba(30,41,59,0.85);
    backdrop-filter:blur(20px);
    padding:45px;
    border-radius:28px;
    width:95%;
    max-width:430px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
    font-size:34px;
    font-weight:900;
    margin-bottom:10px;
    color:#60a5fa;
}

.subtitle{
    color:#cbd5e1;
    font-size:15px;
    margin-bottom:30px;
    line-height:1.8;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

.google{
    background:white;
    color:black;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
}

.google:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 25px rgba(255,255,255,.15);
}

.back{
    margin-top:22px;
    display:block;
    color:#93c5fd;
    text-decoration:none;
    font-size:15px;
}

.back:hover{
    color:white;
}
.give{
    color:#facc15;
}

.add{
    color:#22c55e;
}

</style>
</head>

<body>

<div class="box">

<div class="logo">
    <span class="give">Give</span><span class="add">Add</span>
</div>

<div class="subtitle">
سجّل دخولك للوصول إلى حسابك، إدارة أرباحك، ومتابعة حملاتك الإعلانية بسهولة.
</div>

<button class="google" onclick="googleLogin()">
<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="22">
تسجيل الدخول بواسطة Google
</button>

<a class="back" href="index.html">العودة للرئيسية</a>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getAuth,
GoogleAuthProvider,
signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "giveadd-d3362.firebaseapp.com",
projectId: "giveadd-d3362",
storageBucket: "giveadd-d3362.appspot.com",
messagingSenderId: "544069122993",
appId: "1:544069122993:web:507c018c7f4cde87b35b90"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.googleLogin = async function () {
try{
const result = await signInWithPopup(auth, provider);
alert("تم تسجيل الدخول بنجاح ✅");
window.location.href = "profile.html";
}catch(error){
alert("خطأ: " + error.message);
}
};
</script>

</body>
</html>
