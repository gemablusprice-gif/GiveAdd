<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ابدأ الربح - GiveAdd</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Cairo,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    padding:40px;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:40px;
}

.ads{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:20px;
    text-align:center;
}

.card img{
    width:100%;
    border-radius:15px;
    margin-bottom:15px;
}

.card h3{
    margin-bottom:10px;
}

.card p{
    color:#cbd5e1;
    margin-bottom:15px;
}

.btn{
    display:inline-block;
    padding:10px 20px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

.btn:hover{
    background:#1d4ed8;
}

</style>
</head>

<body>

<div class="container">

<h1>ابدأ الربح من الإعلانات</h1>

<div class="ads">

<div class="card">
<img src="https://picsum.photos/300/200?1">

<h3>إعلان متجر إلكتروني</h3>

<p>
شاهد الإعلان واحصل على نقاط وأرباح.
</p>

<a href="#" class="btn">مشاهدة الإعلان</a>
</div>

<div class="card">
<img src="https://picsum.photos/300/200?2">

<h3>إعلان تطبيق جديد</h3>

<p>
اكسب المال مقابل مشاهدة الإعلان.
</p>

<a href="#" class="btn">مشاهدة الإعلان</a>
</div>

</div>

</div>

</body>
</html>
