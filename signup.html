<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل جديد - GiveAdd</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    color:white;
}

.signup-box{
    background:#1e293b;
    width:100%;
    max-width:500px;
    padding:40px;
    border-radius:25px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.signup-box h1{
    text-align:center;
    margin-bottom:30px;
    font-size:35px;
}

.input-box{
    margin-bottom:20px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    color:#cbd5e1;
}

.input-box input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#334155;
    color:white;
    font-size:16px;
}

.input-box input::placeholder{
    color:#94a3b8;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.02);
}

.login-link{
    text-align:center;
    margin-top:20px;
    color:#cbd5e1;
}

.login-link a{
    color:#60a5fa;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="signup-box">

<h1>تسجيل حساب جديد</h1>

<form>

<div class="input-box">
<label>الاسم الكامل</label>
<input type="text" placeholder="أدخل اسمك الكامل">
</div>

<div class="input-box">
<label>البريد الإلكتروني</label>
<input type="email" placeholder="أدخل بريدك الإلكتروني">
</div>

<div class="input-box">
<label>كلمة المرور</label>
<input type="password" placeholder="أدخل كلمة المرور">
</div>

<div class="input-box">
<label>تأكيد كلمة المرور</label>
<input type="password" placeholder="أعد إدخال كلمة المرور">
</div>

<button type="submit">
إنشاء حساب
</button>

</form>

<div class="login-link">
لديك حساب بالفعل؟
<a href="register.html">تسجيل الدخول</a>
</div>

</div>

</body>
</html>
