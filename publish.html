<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نشر إعلان - GiveAdd</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Cairo,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.form-box{
    background:#1e293b;
    padding:40px;
    border-radius:20px;
    width:100%;
    max-width:500px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

input,
textarea{
    width:100%;
    padding:15px;
    margin-bottom:20px;
    border:none;
    border-radius:10px;
    background:#334155;
    color:white;
}

textarea{
    resize:none;
    height:120px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

</style>
</head>

<body>

<div class="form-box">

<h1>نشر إعلان جديد</h1>

<form>

<input type="text" placeholder="عنوان الإعلان">

<input type="url" placeholder="رابط الإعلان">

<textarea placeholder="وصف الإعلان"></textarea>

<button type="submit">
نشر الإعلان
</button>

</form>

</div>

</body>
</html>
