<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول - GiveAdd</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Cairo,sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
}

.form-box{
    background:#1e293b;
    padding:40px;
    border-radius:20px;
    width:90%;
    max-width:420px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:20px;
    border:none;
    border-radius:10px;
    background:#334155;
    color:white;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.link{
    text-align:center;
    margin-top:20px;
}

.link a{
    color:#60a5fa;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="form-box">

<h1>تسجيل الدخول</h1>

<form>

<input type="email" placeholder="البريد الإلكتروني" required>

<input type="password" placeholder="كلمة المرور" required>

<button type="submit">
دخول
</button>

</form>
<button type="button" onclick="window.location.href='auth.html'">
تسجيل بواسطة Google أو الإيميل
</button>
<div class="link">
ليس لديك حساب؟
<a href="signup.html">إنشاء حساب جديد</a>
</div>

</div>

</body>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// 🔥 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCTmzHb8RxxNeWKdMMcb9ThOW5LLLkzzxo",
  authDomain: "giveadd-d3362.firebaseapp.com",
  projectId: "giveadd-d3362",
  storageBucket: "giveadd-d3362.firebasestorage.app",
  messagingSenderId: "544069122993",
  appId: "1:544069122993:web:507c018c7f4cde87b35b90",
  measurementId: "G-T7B61HBD9B"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 👇 ربط الفورم الصحيح
document.querySelector("form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.querySelector('input[type="email"]').value;
    const password = document.querySelector('input[type="password"]').value;

    try {
        const userCredential = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        alert("تم تسجيل الدخول بنجاح ✅");

        console.log(userCredential.user);

        // تحويل لصفحة المستخدم
        window.location.href = "profile.html";

    } catch (error) {
        alert("خطأ: " + error.message);
    }
});
</script>
</html>
